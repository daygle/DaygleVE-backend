[package]
name = "daygleve-backend"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "DaygleVE hypervisor engine: KVM/QEMU + LXC + ZFS + networking + GPU passthrough, exposed as a versioned REST API."
repository = "https://github.com/daygle/DaygleVE-backend"

[dependencies]
# Shared API contract. Types are imported from DaygleVE-schema — never
# redefined here. Tracks the schema's `main`; move to a tagged release once the
# schema publishes one (see docs/VERSIONING.md there).
daygleve-schema = { git = "https://github.com/daygle/DaygleVE-schema", branch = "main" }

axum = { version = "0.8", features = ["macros", "ws"] }
# TLS-terminating server (rustls) for optional built-in HTTPS.
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Pulled in transitively by axum-server; named directly so we can install the
# process-level crypto provider that rustls 0.23 requires before serving TLS.
rustls = "0.23"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
futures = "0.3"
# Password hashing for the auth service (pure Rust).
argon2 = "0.5"
# OS RNG for password salts and bearer tokens (matches argon2's rand_core).
rand_core = { version = "0.6", features = ["getrandom"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
